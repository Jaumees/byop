# Description: Source code update checker
#

name: Update Checker

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

on:
  workflow_dispatch:
# 如果你想启用定时检测，把下面两行的 # 删掉即可 (当前为每 18 小时检测一次)
#  schedule:
#    - cron: 0 */18 * * *

# 赋予删除旧 Actions 运行记录的权限
permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - name: Get upstream commit hash (极速获取远程源码 Hash)
      id: getHash
      run: |
        # 使用 ls-remote 直接读取远程分支的 Hash，无需克隆整个仓库，耗时不到 1 秒
        COMMIT_HASH=$(git ls-remote --heads $REPO_URL refs/heads/$REPO_BRANCH | awk '{print $1}')
        echo "commitHash=$COMMIT_HASH" >> $GITHUB_OUTPUT
        echo "Latest upstream commit is: $COMMIT_HASH"

    - name: Compare with cached hash (比对历史记录)
      id: cacheHash
      uses: actions/cache@v4 # 升级至 v4
      with:
        path: .commitHash
        key: HEAD-${{ steps.getHash.outputs.commitHash }}

    - name: Save new commit hash (保存最新 Hash)
      if: steps.cacheHash.outputs.cache-hit != 'true'
      run: |
        echo ${{ steps.getHash.outputs.commitHash }} > .commitHash

    - name: Trigger build (触发编译工作流)
      if: steps.cacheHash.outputs.cache-hit != 'true'
      uses: peter-evans/repository-dispatch@v3 # 升级至 v3
      with:
        token: ${{ secrets.ACTIONS_TRIGGER_PAT }}
        event-type: Source Code Update

    - name: Delete old workflow runs (清理旧运行记录)
      uses: Mattraks/delete-workflow-runs@v2 # 替换为维护更好、无警告的新插件
      with:
        retain_days: 1
        keep_minimum_runs: 2
        token: ${{ github.token }}
